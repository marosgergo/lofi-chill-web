<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gere szabadságon | Cozy Lo-Fi Chill World</title>
  <meta name="description" content="Gere szabadságon - animált lo-fi pixel art világ. DayZ, kódolás határidők nélkül, folyóparti séta, panel konyha és békés alvás lo-fi zenével.">
  
  <!-- Google Fonts for Retro Pixel & Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/images/avatar_gere.jpg">
</head>
<body>
  <!-- Main App Shell -->
  <div class="app-container" id="appContainer">
    
    <!-- Clean Minimal Header with Minimal Mute Button -->
    <header class="header-bar" id="headerBar">
      <h1 class="main-title" id="mainTitle">Gere szabadságon</h1>
      <button class="mute-btn-minimal" id="muteBtn" title="Némítás / Visszahangosítás (M)" aria-label="Némítás">
        <span id="muteIcon">🔊</span>
      </button>
    </header>

    <!-- Main Scene Theater Stage -->
    <main class="stage-container" id="stageContainer">
      
      <!-- Stage Viewport -->
      <div class="stage-viewport" id="stageViewport">
        
        <!-- Scene 1: DayZ Survival Gaming -->
        <section class="scene-card active" id="scene-gaming" data-scene-id="gaming">
          <div class="scene-image-container">
            <img src="assets/images/scene_gaming_dayz.jpg" alt="Gere DayZ survival játékkal játszik" class="scene-img">
            <canvas class="scene-fx-canvas" id="canvas-gaming"></canvas>
            <div class="scene-light-glow glow-cyan-purple"></div>
          </div>
        </section>

        <!-- Scene 2: Dedicated Coding Scene -->
        <section class="scene-card" id="scene-coding" data-scene-id="coding">
          <div class="scene-image-container">
            <img src="assets/images/scene_coding.jpg" alt="Gere éjszaka kódol két monitor előtt" class="scene-img">
            <canvas class="scene-fx-canvas" id="canvas-coding"></canvas>
            <div class="scene-light-glow glow-cyan-purple"></div>
          </div>
        </section>

        <!-- Scene 3: Walking in Riverside Forest -->
        <section class="scene-card" id="scene-walking" data-scene-id="walking">
          <div class="scene-image-container">
            <img src="assets/images/scene_forest_walk.jpg" alt="Gere sétál a folyóparti erdőben" class="scene-img">
            <canvas class="scene-fx-canvas" id="canvas-walking"></canvas>
            <div class="scene-light-glow glow-sunset"></div>
          </div>
        </section>

        <!-- Scene 4: Cooking in Small Panel Apartment Kitchen -->
        <section class="scene-card" id="scene-cooking" data-scene-id="cooking">
          <div class="scene-image-container">
            <img src="assets/images/scene_panel_kitchen.jpg" alt="Gere főz a panel konyhában" class="scene-img">
            <canvas class="scene-fx-canvas" id="canvas-cooking"></canvas>
            <div class="scene-light-glow glow-warm-kitchen"></div>
          </div>
        </section>

      </div>

      <!-- Arrow Navigation Controls -->
      <button class="nav-arrow nav-prev" id="prevSceneBtn" title="Előző jelenet (Balra nyíl)">❮</button>
      <button class="nav-arrow nav-next" id="nextSceneBtn" title="Következő jelenet (Jobbra nyíl)">❯</button>

      <!-- Mobile Swipe Instruction Hint -->
      <div class="swipe-hint" id="swipeHint">
        <span>👈 Húzd balra/jobbra a lapozáshoz 👉</span>
      </div>
    </main>

  </div>

  <!-- Audio and Interactive Scripts -->
  <script src="js/audio-engine.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
