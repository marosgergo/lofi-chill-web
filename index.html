<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gere szabadságon | Cozy Lo-Fi Chill World</title>
  <meta name="description" content="Gere szabadságon - animált lo-fi pixel art világ. Retro gamer szoba, éjszakai kódolás esőben és hacker eszközökkel, napsütötte természet és esti utca lo-fi zenével.">
  
  <!-- Mobile Theme Color -->
  <meta name="theme-color" content="#0e0e17">

  <!-- Google Fonts for Retro Pixel & Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=20261014_7">
  <link rel="icon" type="image/jpeg" href="assets/images/avatar_gere.jpg">
</head>
<body>
  <!-- Main App Shell -->
  <div class="app-container" id="appContainer">
    
    <!-- Clean Minimal Header with Fullscreen & Mute Buttons -->
    <header class="header-bar" id="headerBar">
      <div class="header-left">
        <h1 class="main-title" id="mainTitle">Gere szabadságon</h1>
      </div>

      <div class="header-right">
        <button class="control-btn-minimal" id="fullscreenBtn" title="Teljes képernyő (F)" aria-label="Teljes képernyő">
          <svg class="fullscreen-svg" id="fullscreenSvg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <g class="icon-expand">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </g>
            <g class="icon-compress" style="display: none;">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
            </g>
          </svg>
        </button>
        <button class="control-btn-minimal mute-btn-minimal" id="muteBtn" title="Némítás / Visszahangosítás (M)" aria-label="Némítás">
          <span id="muteIcon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Main Scene Theater Stage -->
    <main class="stage-container" id="stageContainer">
      
      <!-- Stage Viewport -->
      <div class="stage-viewport" id="stageViewport">
        
        <!-- Scene 1: Gamer Szoba Monster Energy dobozokkal -->
        <section class="scene-card active" id="scene-gaming" data-scene-id="gaming">
          <div class="scene-image-container">
            <img src="assets/loops/loop_gaming.gif" alt="Animált lo-fi gamer szoba Monster Energy dobozokkal" class="scene-img" loading="eager">
            <div class="scene-light-glow glow-cyan-purple"></div>
          </div>
        </section>

        <!-- Scene 2: Esős Kódolás Hacker Eszközökkel és Monsterrel -->
        <section class="scene-card" id="scene-coding" data-scene-id="coding">
          <div class="scene-image-container">
            <img src="assets/loops/loop_coding.gif" alt="Animált lo-fi kódolás esővel, Flipper Zeroval, SDR antennával és Monsterrel" class="scene-img" loading="eager">
            <div class="scene-light-glow glow-cyan-purple"></div>
          </div>
        </section>

        <!-- Scene 3: Napsütötte Erdei Séta a Folyóparton -->
        <section class="scene-card" id="scene-walking" data-scene-id="walking">
          <div class="scene-image-container">
            <img src="assets/loops/loop_forest_walk.gif" alt="Animált erdei séta folyóparton Gere-rel, hullámzó vízzel és őszi falevelekkel" class="scene-img" loading="eager">
            <div class="scene-light-glow glow-sunset"></div>
          </div>
        </section>

        <!-- Scene 4: Meghitt Panelkonyha Főzés -->
        <section class="scene-card" id="scene-cooking" data-scene-id="cooking">
          <div class="scene-image-container">
            <img src="assets/loops/loop_panel_kitchen.gif" alt="Animált panelkonyha főzés Gere-rel, gázlánggal, gőzzel és csillagos ablakkal" class="scene-img" loading="eager">
            <div class="scene-light-glow glow-warm-kitchen"></div>
          </div>
        </section>

      </div>

      <!-- Arrow Navigation Controls -->
      <button class="nav-arrow nav-prev" id="prevSceneBtn" title="Előző jelenet (Balra nyíl)">❮</button>
      <button class="nav-arrow nav-next" id="nextSceneBtn" title="Következő jelenet (Jobbra nyíl)">❯</button>

      <!-- Audio Autoplay Fallback Prompt (Cozy Pill) -->
      <div class="audio-start-prompt hidden" id="audioStartPrompt" role="button" tabindex="0" title="Kattints a zene elindításához">
        <span class="audio-prompt-icon">🎧</span>
        <span class="audio-prompt-text">Kattints bárhová a lo-fi zenéhez</span>
        <span class="audio-prompt-sub">🎵</span>
      </div>
    </main>

    <!-- Mobile Device Rotation Hint (Visible only on mobile portrait) -->
    <div class="rotate-hint" id="rotateHint">
      <span class="rotate-hint-icon">🔄</span>
      <span class="rotate-hint-text">A teljes mozis élményhez fordítsd el a telefont!</span>
    </div>

  </div>

  <!-- Audio and Interactive Scripts -->
  <script src="js/audio-engine.js?v=20261014_7"></script>
  <script src="js/app.js?v=20261014_7"></script>
</body>
</html>
